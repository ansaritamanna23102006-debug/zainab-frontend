<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
  </defs>
  
  {/* Background */}
  <rect width="600" height="400" fill="url(#bg)" rx="16" />
  
  {/* Abstract Doctor Desk lines */}
  <path d="M 0 300 Q 150 250 300 290 T 600 280 L 600 400 L 0 400 Z" fill="#1e293b" opacity="0.3"/>
  <path d="M 0 340 L 600 300 L 600 400 L 0 400 Z" fill="url(#primaryGrad)" opacity="0.1"/>
  
  {/* Stethoscope Graphic */}
  <g transform="translate(300, 160)" text-anchor="middle">
    <circle cx="0" cy="-30" r="35" stroke="url(#primaryGrad)" stroke-width="4" fill="none" opacity="0.3" stroke-dasharray="5 5" />
    
    <text x="0" y="30" font-family="'Poppins', sans-serif" font-weight="700" font-size="26" fill="#ffffff">CONSULTATION ROOM</text>
    <text x="0" y="55" font-family="'Inter', sans-serif" font-weight="500" font-size="13" fill="#a1a1aa" letter-spacing="3">DR. SHOEB SHAIKH</text>
    <text x="0" y="80" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#16a34a" letter-spacing="1">B.A.M.S. | REG. NO. I-84363-A-1</text>
  </g>
</svg>
