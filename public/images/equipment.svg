<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
  </defs>
  
  {/* Background */}
  <rect width="600" height="400" fill="url(#bg)" rx="16" />
  
  {/* Diagnostics Wave lines */}
  <path d="M 0 350 Q 150 310 300 340 T 600 320 L 600 400 L 0 400 Z" fill="url(#primaryGrad)" opacity="0.15"/>
  
  {/* ECG Graphic */}
  <g transform="translate(300, 160)" text-anchor="middle">
    <path d="M -80 -20 H -40 L -30 -50 L -20 10 L -10 -30 L 0 -10 L 10 -20 H 80" stroke="#16a34a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
    
    <text x="0" y="35" font-family="'Poppins', sans-serif" font-weight="700" font-size="26" fill="#ffffff">DIAGNOSTICS & CARE</text>
    <text x="0" y="60" font-family="'Inter', sans-serif" font-weight="500" font-size="13" fill="#a1a1aa" letter-spacing="3">BP & DIABETES MONITORING</text>
    <text x="0" y="85" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#16a34a" letter-spacing="1">NEBULIZATION & WOUND DRESSING</text>
  </g>
</svg>
